[project]
name = "mozhi"
version = "0.1.0"
description = "AI multilingual dubbing platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
vad = [
    "silero-vad>=6.2.1",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates long Column(...) lines — don't fight the generator.
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "app.celery_app", "app.task_base", "app.reaper"]
ignore_missing_imports = true
follow_untyped_imports = true
# Celery is fully untyped — strict checks are impossible against it.
disable_error_code = ["no-untyped-call", "no-untyped-def", "untyped-decorator", "misc", "no-any-return"]

# Heavy optional ML deps (the 'vad' extra) — absent in CI, present locally.
# Per-module overrides suppress ALL codes for them regardless of install state.
[[tool.mypy.overrides]]
module = ["silero_vad", "silero_vad.*", "torch", "torch.*", "faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true
follow_untyped_imports = true
