name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mozhi
          POSTGRES_PASSWORD: mozhi
          POSTGRES_DB: mozhi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mozhi -d mozhi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MOZHI_DATABASE_URL: postgresql+asyncpg://mozhi:mozhi@localhost:5432/mozhi
      MOZHI_REDIS_URL: redis://localhost:6379/0
      MOZHI_ENGINE_MODE: mock

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: uv sync
      - name: Lint
        run: uv run ruff check app tests
      - name: Typecheck
        run: uv run mypy app
      - name: Run migrations
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest -n auto --dist loadgroup -q
