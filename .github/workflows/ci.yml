name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: uv sync
      - name: Lint
        run: uv run ruff check app tests
      - name: Typecheck
        run: uv run mypy app
      - name: Test
        run: uv run pytest -n auto -q
